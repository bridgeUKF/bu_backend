services:
  postgres:
    image: postgres:16-alpine
    container_name: bridgeukf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridgesk
      POSTGRES_PASSWORD: bridgesk
      POSTGRES_DB: bridgesk_db
    ports:
      - "5432:5432"
    volumes:
      - bridgeukf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgesk -d bridgesk_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bridgeukf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations + seeds roles, then exits.
  # Migrations never run inside the app itself.
  migrate:
    build: .
    container_name: bridgeukf_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bridgesk:bridgesk@postgres:5432/bridgesk_db
      REDIS_URL: redis://redis:6379
    command: >
      sh -c "npx prisma migrate deploy && node prisma/seed.js"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: bridgeukf_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bridgesk:bridgesk@postgres:5432/bridgesk_db
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/v1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  bridgeukf_postgres_data:
